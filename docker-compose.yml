services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./src
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
